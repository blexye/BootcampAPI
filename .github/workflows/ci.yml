name: CI-CD BootcampAPI

on:
  push:
    branches: [not-main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, test y publicado
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setear tag de la imagen
        id: meta
        shell: bash
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore BootcampAPI.slnx

      - name: Build
        run: dotnet build BootcampAPI.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test BootcampAPI.slnx --configuration Release --no-build --verbosity normal

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Validar Helm chart
        run: |
          helm lint helm/helm/accounts-api
          helm template accounts-api helm/helm/accounts-api > /dev/null

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build y push de la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/accounts-api:${{ steps.meta.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/accounts-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  cd:
    name: Desplegar en Minikube local
    needs: ci
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar contexto de Minikube
        shell: powershell
        run: |
          minikube status
          kubectl config use-context minikube
          kubectl cluster-info

      - name: Desplegar PostgreSQL y Seq
        shell: powershell
        run: |
          kubectl apply -f helm/k8s/00-namespace.yaml
          kubectl apply -f helm/k8s
          kubectl rollout status deployment/postgres --namespace accounts --timeout=120s
          kubectl rollout status deployment/seq --namespace accounts --timeout=120s

      - name: Deplegar API con Helm
        shell: powershell
        run: |
          helm upgrade --install accounts-api ./helm/helm/accounts-api `
            --namespace accounts `
            --create-namespace `
            --set image.repository=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/accounts-api `
            --set image.tag=${{ needs.ci.outputs.image_tag }} `
            --set image.pullPolicy=Always `
            --set probes.path=/api/minimal `
            --wait `
            --timeout 3m

      - name: Verificar API rollout
        shell: powershell
        run: |
          kubectl rollout status deployment/accounts-api --namespace accounts --timeout=120s
          kubectl get pods,services --namespace accounts